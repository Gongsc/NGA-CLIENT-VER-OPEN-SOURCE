name: Release

on:
  push:
    tags:
      - 'v[0-9]*.[0-9]*.[0-9]*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v7

      - name: Read version from build.gradle
        id: version
        run: |
          name=$(sed -n "s/^ *appVersionName = '\(.*\)'.*/\1/p" build.gradle)
          code=$(sed -n "s/^ *appVersionCode = \([0-9]*\).*/\1/p" build.gradle)
          tag_version="${TAG#v}"
          if [ "${tag_version%%-*}" != "$name" ]; then
            echo "::error::Tag $TAG does not match appVersionName $name in build.gradle"
            exit 1
          fi
          prerelease=false
          case "$tag_version" in *-*) prerelease=true ;; esac
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Check signing secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.NGA_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.NGA_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.NGA_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.NGA_KEY_PASSWORD }}
        run: |
          missing=""
          [ -n "$KEYSTORE_BASE64" ] || missing="$missing NGA_KEYSTORE_BASE64"
          [ -n "$KEYSTORE_PASSWORD" ] || missing="$missing NGA_KEYSTORE_PASSWORD"
          [ -n "$KEY_ALIAS" ] || missing="$missing NGA_KEY_ALIAS"
          [ -n "$KEY_PASSWORD" ] || missing="$missing NGA_KEY_PASSWORD"
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secrets:$missing"
            exit 1
          fi
          if ! printf '%s' "$KEYSTORE_BASE64" | tr -d ' \r\n' | base64 -d > "$RUNNER_TEMP/release.jks" 2>/dev/null; then
            echo "::error::NGA_KEYSTORE_BASE64 is not valid Base64"
            exit 1
          fi
          # Same trimming as build.gradle: pasted secrets often end with a newline.
          store_pass=$(printf '%s' "$KEYSTORE_PASSWORD" | tr -d '\r' | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')
          alias=$(printf '%s' "$KEY_ALIAS" | tr -d '\r' | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')
          if ! keytool -list -keystore "$RUNNER_TEMP/release.jks" -storepass "$store_pass" > /dev/null 2>&1; then
            echo "::error::Cannot open the keystore: NGA_KEYSTORE_BASE64 or NGA_KEYSTORE_PASSWORD is wrong"
            exit 1
          fi
          if ! keytool -list -keystore "$RUNNER_TEMP/release.jks" -storepass "$store_pass" -alias "$alias" > /dev/null 2>&1; then
            echo "::error::NGA_KEY_ALIAS does not match any key in the keystore"
            exit 1
          fi

      - name: Install Android SDK packages
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0" "build-tools;36.0.0" > /dev/null

      - uses: gradle/actions/setup-gradle@v6

      - name: Unit tests
        run: ./gradlew :nga_phone_base_3.0:testDebugUnitTest

      - name: Build signed release APK
        env:
          NGA_KEYSTORE_FILE: ${{ runner.temp }}/release.jks
          NGA_KEYSTORE_PASSWORD: ${{ secrets.NGA_KEYSTORE_PASSWORD }}
          NGA_KEY_ALIAS: ${{ secrets.NGA_KEY_ALIAS }}
          NGA_KEY_PASSWORD: ${{ secrets.NGA_KEY_PASSWORD }}
        run: ./gradlew :nga_phone_base_3.0:assembleRelease

      - name: Verify signature, required classes and collect artifacts
        run: |
          apk=nga_phone_base_3.0/build/outputs/apk/release/nga_phone_base_3.0-release.apk
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs "$apk"
          .github/scripts/check-apk-classes.sh "$apk" "$ANDROID_HOME/build-tools/36.0.0/dexdump"
          mkdir -p dist
          cp "$apk" "dist/NGA-${{ steps.version.outputs.name }}.apk"
          (cd dist && sha256sum *.apk > SHA256SUMS.txt)

      - name: Write release notes
        run: |
          python3 - "${{ steps.version.outputs.code }}" > dist/notes.md <<'EOF'
          import re, sys
          code = sys.argv[1]
          src = open("nga_phone_base_3.0/src/main/java/sp/phone/common/VersionUpgradeTips.java", encoding="utf-8").read()
          match = re.search(r"String TIPS_%s\s*=\s*(.*?);" % code, src, re.S)
          if not match:
              sys.exit(0)
          text = "".join(re.findall(r'"((?:[^"\\]|\\.)*)"', match.group(1)))
          text = text.replace("\\n", "\n").replace('\\"', '"')
          for line in text.strip().splitlines():
              line = line.strip()
              print("- " + line[1:].strip() if line.startswith("●") else line)
          EOF
          cat dist/notes.md

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          args=(--verify-tag --title "NGA 客户端 ${{ steps.version.outputs.name }}")
          if [ -s dist/notes.md ]; then args+=(--notes-file dist/notes.md); else args+=(--generate-notes); fi
          if [ "${{ steps.version.outputs.prerelease }}" = "true" ]; then args+=(--prerelease); fi
          gh release create "$TAG" dist/*.apk dist/SHA256SUMS.txt "${args[@]}"

      - name: Remove keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"
