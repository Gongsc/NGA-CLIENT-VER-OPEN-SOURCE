plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.plugin.compose'
}

android {
    namespace = "gov.anzong.androidnga"
    buildFeatures { buildConfig = true }
    compileSdk = rootProject.ext.compileSdkVersion


    buildFeatures { compose = true }

    packaging {
        resources {
            excludes += ['META-INF/LICENSE.txt', 'META-INF/NOTICE.txt', 'META-INF/MANIFEST.MF']
        }
    }

    defaultConfig {
        applicationId = "gov.anzong.androidnga"
        testInstrumentationRunner = "androidx.test.runner.AndroidJUnitRunner"
        minSdk = rootProject.ext.minSdkVersion
        targetSdk = rootProject.ext.targetSdkVersion
        resourceConfigurations += ['zh', 'en']

        versionCode = rootProject.ext.appVersionCode
        versionName = rootProject.ext.appVersionName

        ndk {
            abiFilters 'armeabi-v7a','arm64-v8a'
        }
    }
    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    // Release signing comes only from the environment (CI secrets); without it release builds stay unsigned.
    // Values pasted into CI secrets often carry a trailing newline, so whitespace is trimmed.
    def signingEnv = { String name -> System.getenv(name)?.trim() }
    def releaseKeystore = signingEnv('NGA_KEYSTORE_FILE')
    signingConfigs {
        if (releaseKeystore) {
            release {
                storeFile = file(releaseKeystore)
                storePassword = signingEnv('NGA_KEYSTORE_PASSWORD')
                keyAlias = signingEnv('NGA_KEY_ALIAS')
                keyPassword = signingEnv('NGA_KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            if (releaseKeystore) signingConfig = signingConfigs.release
            debuggable = false
            jniDebuggable = false
            pseudoLocalesEnabled = false
            minifyEnabled = false
        }
        debug {
            // 调试版使用独立包名，可与正式版同时安装，互不覆盖数据
            applicationIdSuffix = ".debug"
            debuggable = true
            minifyEnabled = false
        }
    }


    lint {
        abortOnError = true
        sarifReport = false
        disable += 'MissingTranslation'
    }

}

dependencies {
    implementation platform('androidx.compose:compose-bom:2026.09.00')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.material:material-icons-core'
    implementation 'androidx.activity:activity-compose:1.13.0'
    implementation 'androidx.fragment:fragment-compose:1.9.1'
    debugImplementation 'androidx.compose.ui:ui-tooling'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation platform('androidx.compose:compose-bom:2026.09.00')
    androidTestImplementation 'androidx.compose.ui:ui-test-junit4'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
    androidTestImplementation 'androidx.test:runner:1.7.0'
    debugImplementation 'androidx.compose.ui:ui-test-manifest'

    implementation fileTree(include: '*.jar', dir: 'libs')

    implementation "androidx.viewpager2:viewpager2:1.1.0"
    implementation "androidx.swiperefreshlayout:swiperefreshlayout:1.2.0"
    implementation "com.google.android.material:material:${rootProject.ext.androidxMaterial}"

    implementation "androidx.lifecycle:lifecycle-viewmodel-ktx:${rootProject.ext.lifecycle_version}"
    implementation "androidx.lifecycle:lifecycle-runtime-ktx:${rootProject.ext.lifecycle_version}"

    // coroutines
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:${rootProject.ext.coroutines}"
    testImplementation "org.jetbrains.kotlinx:kotlinx-coroutines-test:${rootProject.ext.coroutines}"

    // lifecycle
    implementation "androidx.lifecycle:lifecycle-viewmodel:${rootProject.ext.lifecycle_version}"


    //glide
    implementation 'com.github.bumptech.glide:glide:4.16.0'
    annotationProcessor 'com.github.bumptech.glide:compiler:4.16.0'

    implementation 'org.jsoup:jsoup:1.23.2'
    implementation "com.squareup.retrofit2:retrofit:${rootProject.ext.retrofit}"
    implementation "com.squareup.okhttp3:okhttp:${rootProject.ext.okhttp}"

    implementation project(':lib_common')
    implementation project(':lib_core')
    implementation project(":lib_network")

    // database
    implementation "androidx.room:room-runtime:${rootProject.ext.room_version}"
    annotationProcessor "androidx.room:room-compiler:${rootProject.ext.room_version}"

    // kotlin
    implementation "androidx.core:core-ktx:1.19.1"
}
