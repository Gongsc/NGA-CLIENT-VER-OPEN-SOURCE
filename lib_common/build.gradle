plugins {
    id 'com.android.library'
}

android {
    namespace = "gov.anzong.androidnga.common"
    buildFeatures { buildConfig = true }
    compileSdk = rootProject.ext.compileSdkVersion


    defaultConfig {
        minSdk = rootProject.ext.minSdkVersion

        testInstrumentationRunner = "androidx.test.runner.AndroidJUnitRunner"

    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    buildTypes {
        release {
            minifyEnabled = false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])

    testImplementation 'junit:junit:4.13.2'

    implementation "com.google.android.material:material:${rootProject.ext.androidxMaterial}"
    api "androidx.appcompat:appcompat:${rootProject.ext.androidxAppcompat}"

    api 'io.reactivex.rxjava2:rxjava:2.1.5'

    api "io.reactivex.rxjava2:rxandroid:${rootProject.ext.rxAndroid}"


    // kotlin
    implementation "androidx.core:core-ktx:1.17.0"

    // okhttp
    implementation "com.squareup.okhttp3:okhttp:${rootProject.ext.okhttp}"
}
